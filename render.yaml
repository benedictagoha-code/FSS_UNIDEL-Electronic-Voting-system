# Render free web service. Database is external so no expiring Render Postgres
# is provisioned. Set DATABASE_URL to a separately created free PostgreSQL service.
services:
  - type: web
    name: fss-unidel-voting
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_MODE
        value: require
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SMS_PROVIDER
        value: unconfigured
